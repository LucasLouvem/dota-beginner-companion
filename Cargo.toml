[package]
name = "dota-companion"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
directories = "6.0.0"
dotenvy = "0.15.7"
getrandom = "0.4.3"
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
relm4 = { version = "0.11.0", features = ["libadwaita", "gnome_47"] }
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
