# Verificação ortográfica do código (identificadores e comentários).
# Textos em Markdown ficam de fora: são verificados pelo dprint e pelo rumdl.

[files]
extend-exclude = ["*.md", "LICENSE", "Cargo.lock", "tests/fixtures/", "target/"]

# Nomes próprios do projeto e palavras em português usadas nos comentários
# que o dicionário em inglês confunde com erros.
[default.extend-words]
dota = "dota"
relm = "relm"
processos = "processos"
itens = "itens"
reinstale = "reinstale"
fase = "fase"
comandos = "comandos"
momento = "momento"
erro = "erro"
atual = "atual"
argumentos = "argumentos"
sinal = "sinal"
programa = "programa"
cliente = "cliente"
componente = "componente"
limite = "limite"
inicial = "inicial"
falso = "falso"
comando = "comando"
componentes = "componentes"
erros = "erros"
vai = "vai"
converte = "converte"
conter = "conter"
caractere = "caractere"
